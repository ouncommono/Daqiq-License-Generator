[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daqiq-license-generator"
version = "1.0.0"
description = "Commercial Offline License Studio for Daqiq Desktop ERP"
authors = [{ name = "ouncommono" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "cryptography>=42.0.0",
    "jdatetime>=5.0.0",
    "packaging>=23.0",
    "pyperclip>=1.8.2",
    "openpyxl>=3.1.2",
]

[project.scripts]
daqiq-license-generator = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
addopts = "-v --strict-markers"
