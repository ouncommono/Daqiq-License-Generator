<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f766e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" filter="url(#glow)"/>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Shield Outline -->
  <path d="M 128 50 
           L 186 74 
           C 186 138, 158 184, 128 206 
           C 98 184, 70 138, 70 74 
           Z" 
        fill="url(#shieldGrad)" fill-opacity="0.22" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Golden Key / Digital Certificate Symbol -->
  <g transform="translate(128, 126)">
    <!-- Key Bow / Ring -->
    <circle cx="0" cy="-30" r="22" fill="none" stroke="url(#keyGrad)" stroke-width="7"/>
    <circle cx="0" cy="-30" r="10" fill="url(#keyGrad)"/>
    
    <!-- Key Stem -->
    <rect x="-4" y="-10" width="8" height="52" rx="3" fill="url(#keyGrad)"/>
    
    <!-- Key Bits / Teeth -->
    <rect x="4" y="16" width="14" height="6" rx="2" fill="url(#keyGrad)"/>
    <rect x="4" y="28" width="10" height="6" rx="2" fill="url(#keyGrad)"/>
    <rect x="-14" y="22" width="10" height="6" rx="2" fill="url(#keyGrad)"/>
    
    <!-- Small Security Dot -->
    <circle cx="0" cy="46" r="3" fill="url(#keyGrad)"/>
  </g>

  <!-- Binary / Security dots accent -->
  <circle cx="95" cy="115" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="161" cy="115" r="3" fill="#60a5fa" opacity="0.6"/>
  <circle cx="86" cy="140" r="2.5" fill="#34d399" opacity="0.5"/>
  <circle cx="170" cy="140" r="2.5" fill="#34d399" opacity="0.5"/>
</svg>
