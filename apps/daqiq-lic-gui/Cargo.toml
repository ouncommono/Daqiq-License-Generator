[package]
name = "daqiq-license-generator"
version = "1.4.2"
edition = "2021"
authors = ["Daqiq Licensing Architecture Team"]
description = "Pure native Win32/Direct2D Rust offline license studio for Daqiq Desktop v4.9.2"

[features]
default = ["sqlite"]
sqlite = ["daqiq-lic-core/sqlite"]

[dependencies]
daqiq-lic-core = { path = "../../crates/daqiq-lic-core", default-features = false }
base64 = "0.22"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Com",
] }
rfd = "0.15"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rand = "0.8"
dirs = "6.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
