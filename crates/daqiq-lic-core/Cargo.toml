[package]
name = "daqiq-lic-core"
version = "1.1.0"
edition = "2021"
authors = ["Daqiq Licensing Architecture Team"]
description = "High-assurance cryptographic licensing core for Daqiq Desktop v4.9.0"

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
sha2 = "0.10"
unicode-normalization = "0.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false }
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
regex = "1.11"
csv = "1.3"

[dev-dependencies]
tempfile = "3.14"
