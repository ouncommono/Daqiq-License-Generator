[package]
name = "daqiq-license-generator"
version = "1.1.0"
description = "Daqiq License Generator Studio v1.1.0"
authors = ["Daqiq Licensing Architecture Team"]
edition = "2021"

[features]
default = ["sqlite"]
sqlite = ["daqiq-lic-core/sqlite"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sha2 = "0.10"
daqiq-lic-core = { path = "../crates/daqiq-lic-core", default-features = false }
