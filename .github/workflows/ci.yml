name: Daqiq License Generator v1.3.0 CI/CD

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-verify-and-release:
    name: Build, Cross-Verify & Release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository (Zero Node Action)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Scan repository for private keys & secrets
        shell: pwsh
        run: |
          $keyPattern = "BEGIN" + " " + "PRIVATE" + " " + "KEY"
          $priv = git grep -in "$keyPattern"
          if ($LASTEXITCODE -eq 0) {
            Write-Error "CRITICAL: Secret pattern detected in repository!"
            exit 1
          }
          $global:LASTEXITCODE = 0
          Write-Output "Security check clean: Zero secret signing keys detected."

      - name: Clone Daqiq PR #39 Source of Truth
        shell: pwsh
        run: |
          $prDir = "$env:RUNNER_TEMP\daqiq_pr39"
          New-Item -ItemType Directory -Force -Path $prDir | Out-Null
          git clone --depth 1 https://github.com/ouncommono/Daqiq.git $prDir
          Push-Location $prDir
          git fetch origin pull/39/head:pr39
          git checkout pr39
          Pop-Location
          Write-Output "DAQIQ_PR39_DIR=$prDir" >> $env:GITHUB_ENV
          Write-Output "Daqiq PR #39 source of truth checked out successfully."

      - name: Run Cross-Repo Verification Gate (Python Verifier vs Spec)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install cryptography jdatetime pytest pytest-timeout
          python -m pytest tests/test_cross_repo_compatibility.py -v --timeout=60

      - name: Setup Rust Toolchain & Target
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          rustup show

      - name: Run Cargo Workspace Tests
        shell: pwsh
        run: |
          cargo test --workspace --verbose

      - name: Build Production Standalone Windows Executable
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          if (-not $ver) { $ver = "1.3.0" }
          Write-Output "APP_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Output "Building release binary for version $ver..."
          cargo build --release -p daqiq-license-generator

      - name: Run Automated PE Header & Zero-WebView DLL Import Audit
        shell: pwsh
        run: |
          $exe = "target\release\daqiq-license-generator.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Release executable not found at: $exe"
            exit 1
          }
          python scripts/verify_pe.py $exe 25.0

      - name: Run Headless Self-Test & Generate Report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $exe = "target\release\daqiq-license-generator.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--report", "dist\selftest_report.json") -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "Headless self-test failed with exit code $($proc.ExitCode)!"
            exit 1
          }
          Get-Content "dist\selftest_report.json"

      - name: Prepare Release Artifacts & SHA256SUMS
        shell: pwsh
        run: |
          $targetName = "Daqiq-License-Generator-v${{ env.APP_VERSION }}-win64.exe"
          $altName = "Daqiq-License-Generator-v${{ env.APP_VERSION }}.exe"
          Copy-Item "target\release\daqiq-license-generator.exe" "dist\$targetName" -Force
          Copy-Item "target\release\daqiq-license-generator.exe" "dist\$altName" -Force
          $sha1 = (Get-FileHash -Algorithm SHA256 "dist\$targetName").Hash.ToLower()
          $sha2 = (Get-FileHash -Algorithm SHA256 "dist\$altName").Hash.ToLower()
          "$sha1  $targetName`n$sha2  $altName" | Out-File -Encoding ascii "dist\SHA256SUMS.txt"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Ensure Open Pull Request to main
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $branch = "${{ github.ref_name }}"
          Write-Output "Checking PR for branch: $branch"
          $pr = gh pr list --head $branch --base main --json number --jq '.[0].number'
          if ($pr) {
            Write-Output "PR #$pr already exists."
          } else {
            gh pr create `
              --base main `
              --head $branch `
              --title "Release v${{ env.APP_VERSION }} — Exact PR #39 Parity, Signature Fix & 60FPS UI" `
              --body "### Daqiq License Generator v${{ env.APP_VERSION }} (Exact PR #39 Parity, Signature Fix & 60FPS UI)`n`n- **Strict 1:1 Parity with Daqiq PR #39 (v4.9.1):** Full support for trial licenses, grace modes, match policies, clock skew, version bounds, and compact Base64 tokens.`n- **Permanent Digital Signature Fix:** Eliminated signature rejection through exact canonical field mapping and introduced Public Key Pairing Verifier.`n- **Native 60FPS Hardware-Accelerated UI:** Powered by iced wgpu DX12/Vulkan with tiny-skia software fallback and zero-work view() architecture.`n- **Modern Desktop UI & Balanced Charcoal Dark Theme:** 220px right-anchored RTL sidebar, soft charcoal Dark theme (#1E222B) and crisp Light theme (#F4F6FA).`n- **Zero WebView2 & Zero External Dependencies:** Single portable standalone executable (< 25 MB) with PE GUI subsystem 2 (zero CMD window).`n- **Offline & Air-Gapped Security:** Bundled Vazirmatn font, AES-256-GCM encrypted vault with PBKDF2 (600,000 rounds) and memory zeroization.`n- **Excel-Compatible CSV Export:** Byte Order Mark (UTF-8 BOM) for flawless Persian encoding in Microsoft Excel.`n- **Automated QA & Self-Test:** Passed all 4 binary gates and cross-repo compatibility tests."
          }

      - name: Publish Production GitHub Release
        if: github.ref == 'refs/heads/release/v1.3.0' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ env.APP_VERSION }}"
          $title = "Daqiq License Generator $tag (Exact PR #39 Parity & 60FPS Native UI)"
          $exePath = "dist\Daqiq-License-Generator-v${{ env.APP_VERSION }}-win64.exe"
          $altExePath = "dist\Daqiq-License-Generator-v${{ env.APP_VERSION }}.exe"
          $sumsPath = "dist\SHA256SUMS.txt"
          $reportPath = "dist\selftest_report.json"

          Write-Output "Publishing release $tag..."
          $exists = gh release view $tag 2>$null
          if ($exists) {
            gh release upload $tag $exePath $altExePath $sumsPath $reportPath --clobber
          } else {
            gh release create $tag $exePath $altExePath $sumsPath $reportPath `
              --title $title `
              --notes "## Daqiq License Generator $tag (Exact PR #39 Parity, Signature Fix & 60FPS Native UI)`n`nCommercial-grade, 100% offline native Windows desktop license studio for **Daqiq Desktop ERP v4.9.1+ (PR #39)**.`n`n### Highlights in v1.3.0:`n- **Exact 1:1 Parity with Daqiq PR #39 (v4.9.1):** Full alignment with all PR #39 schema rules, trial licenses, grace periods (soft/hard), clock skew tolerances, quotas, and compact Base64 tokens.`n- **Permanent Signature Rejection Fix:** Resolved signature verification mismatch through exact canonical field inclusion/omission matching and introduced the Public Key Pairing Verifier.`n- **60FPS Native Hardware Acceleration:** High-performance rendering via iced wgpu (DirectX 12 / Vulkan) with seamless tiny-skia software fallback — eliminating all scroll lag and UI stutter.`n- **Right-Anchored Modern RTL Sidebar & Theme Overhaul:** Professional soft charcoal dark theme (#1E222B) and crisp light theme (#F4F6FA) with bundled offline Persian Vazirmatn font.`n- **Zero WebView2 / Zero External Runtimes:** Single standalone portable executable (< 25 MB) with Windows GUI subsystem (PE Subsystem 2 — zero CMD window).`n- **Public Key Pairing Verifier:** In-app tool to instantly verify active key pair against Daqiq v4.9.1 production key (daqiq-prod-v1).`n- **Persian Excel Export:** CSV exports include UTF-8 BOM for perfect Persian text rendering in Microsoft Excel.`n`n### Attached Binaries & Verification Artifacts:`n- **Daqiq-License-Generator-v${{ env.APP_VERSION }}-win64.exe**`n- **Daqiq-License-Generator-v${{ env.APP_VERSION }}.exe**`n- **SHA256SUMS.txt**`n- **selftest_report.json**" `
              --latest `
              --prerelease=false
          }
